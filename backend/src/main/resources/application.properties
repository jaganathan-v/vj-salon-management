# ==============================================================================
# VIJAYAN SALON MANAGEMENT — APPLICATION CONFIGURATION
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. DATABASE CONNECTIVITY (PostgreSQL)
# ------------------------------------------------------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# 2. JPA & HIBERNATE SETTINGS
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# 3. SERVER & PORT
# ------------------------------------------------------------------------------
server.port=8080
server.servlet.context-path=
server.error.include-message=always

# ------------------------------------------------------------------------------
# 4. FILE UPLOADS (Payment QR, Advertisement Media)
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload.dir=uploads

# ------------------------------------------------------------------------------
# 5. JWT AUTHENTICATION
# ------------------------------------------------------------------------------
jwt.secret=${JWT_SECRET:VJSalonSuperSecretKeyForJWTSigningSalemTamilNaduIndia2024}
jwt.expiration=86400000

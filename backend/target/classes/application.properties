# ------------------------------------------------------------------------------
# 1. DATABASE CONNECTIVITY (PostgreSQL)
# ------------------------------------------------------------------------------
# NOTE: Update these 3 properties to connect to your PostgreSQL instance:
#   - Database Name: Change 'vjsalon_db' if your DB has a different name
#   - Username:      Change 'postgres' to your PostgreSQL username
#   - Password:      Change 'yourpassword' to your PostgreSQL password
spring.datasource.url=jdbc:postgresql://localhost:5432/practice_db
spring.datasource.username=postgres
spring.datasource.password=Jagan7#v
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------------------------------------------------------
# 2. JPA & HIBERNATE SETTINGS
# ------------------------------------------------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ------------------------------------------------------------------------------
# 3. SERVER & PORT
# ------------------------------------------------------------------------------
server.port=8080
server.servlet.context-path=

# ------------------------------------------------------------------------------
# 4. FILE UPLOADS (Payment QR, Advertisement Media)
# ------------------------------------------------------------------------------
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB
file.upload.dir=uploads

# ------------------------------------------------------------------------------
# 5. JWT AUTHENTICATION
# ------------------------------------------------------------------------------
jwt.secret=VJSalonSuperSecretKeyForJWTSigningSalemTamilNaduIndia2024
jwt.expiration=86400000

# ------------------------------------------------------------------------------
# 6. STATIC RESOURCE MAPPINGS
# ------------------------------------------------------------------------------
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:changeme}
jwt.secret=${JWT_SECRET:changeThisDefaultSecretForLocalDevOnly}
server.error.include-message=always

databases:
  - name: vj-salon-db
    databaseName: vjsalon_db
    user: vjsalon
    plan: free

services:
  - type: web
    name: vj-salon-management
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: vj-salon-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: vj-salon-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: vj-salon-db
          property: password
      - key: JWT_SECRET
        generateValue: true
